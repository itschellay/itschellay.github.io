            </button>
            <div class="collapse navbar-collapse ms-5 " id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">

                    <li class="nav-item">

    <div class="container">
        <div class="row" id="content">

        </div>

    <script src="acts.js"></script>

    <script>
        var content = document.getElementById("content");

        for (var i = 0; i < activities.length; i++) {
            content.innerHTML += `
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="card shadow rounded-3 my-4 p-2 w-100 h-100 overflow-hidden">
                            <img src="`+ activities[i].picture + `" class="img-top">
                            <div class="card-body">
                                <h3 class="card-title"> `+ activities[i].title + ` </h3>
                                <p class="description">
                                    `+ activities[i].description + `
                                </p>
                                <a href="https://itschellay.github.io/`+ activities[i].repo + `" class="btn btn-primary">Open</a>
                            </div>
                        </div>
                    </div>`
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
