<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<style>
    .container {
        font-family: 'Inter', sans-serif;
    }
</style>

<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="row" id="content">

        </div>
    </div>

    <script src="acts.js"></script>

    <script>
        const loadNav = async () => {
            const response = await fetch('navbar.html');
            const navbarHtml = await response.text();
            document.getElementById('nav-placeholder').innerHTML = navbarHtml;
        };

        loadNav();

        var content = document.getElementById("content");

        for (var i = 0; i < activities.length; i++) {
            var link = "https://itschellay.github.io/" + activities[i].repo + "/";
            content.innerHTML += `
                    <div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-3">
                    <div class="card my-3 rounded-3 overflow-hidden h-100">
                        <embed type="text/html" src="` + link + `" width="100%" height="200px">
                        <div class="card-body shadow-lg d-flex flex-column">
                        <h6 class="card-title">` + activities[i].title + `</h6>
                        <p class="card-text text-body-secondary">` + activities[i].description + `</p>
                        <a href="` + link + `" alt="` + activities[i].title + `" class="btn btn-primary mt-auto">Open</a>
                         </div>
                    </div>
                    </div> 
                `;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
